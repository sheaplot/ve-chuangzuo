  <main id="main" tabindex="-1">
    <div class="profile-wrap">

      <!-- 未登录 -->
      <section id="view-login" class="card-panel">
        <h1>欢迎回来</h1>
        <p class="profile-sub">登录后，写作、冥想与心情记录会保存到你的账号；不登录也可以直接创作。</p>

        <div style="margin-top:20px">
          <label for="login-user">用户名</label>
          <input id="login-user" type="text" placeholder="给自己起个名字" autocomplete="username">
          <label for="login-pass">密码</label>
          <input id="login-pass" type="password" placeholder="至少 4 位" autocomplete="current-password">
        </div>

        <div class="form-row" style="margin-top:6px">
          <button class="btn btn-primary" id="btn-login">登录</button>
          <button class="btn btn-ghost" id="btn-register">注册新账号</button>
        </div>
        <p class="form-msg" id="login-msg"></p>
      </section>

      <!-- 已登录 -->
      <section id="view-profile" class="hidden">
        <div class="profile-head">
          <div>
            <h1>你好，<span id="who"></span></h1>
            <p class="profile-sub">这些记录只属于你。它们不会被公开，也不会出现在社群里。</p>
          </div>
          <button class="btn btn-ghost" id="btn-logout">退出登录</button>
        </div>

        <div class="card-panel">
          <span class="field-label">今天心情</span>
          <div class="mood-pick" id="q-mood-picks">
            <span class="mood" data-m="😌">😌</span>
            <span class="mood" data-m="😊">😊</span>
            <span class="mood" data-m="🥹">🥹</span>
            <span class="mood" data-m="🥺">🥺</span>
            <span class="mood" data-m="😔">😔</span>
            <span class="mood" data-m="😰">😰</span>
            <span class="mood" data-m="😢">😢</span>
            <span class="mood" data-m="😤">😤</span>
            <span class="mood" data-m="🤩">🤩</span>
            <span class="mood" data-m="🤗">🤗</span>
            <span class="mood" data-m="😵‍💫">😵‍💫</span>
            <span class="mood" data-m="🥰">🥰</span>
          </div>
          <div class="form-row">
            <input id="q-mood-text" type="text" placeholder="想写一句就写（可选）">
            <button class="btn btn-primary" id="btn-q-mood" style="min-height:44px;padding:9px 22px;font-size:0.88rem">记一笔</button>
          </div>
        </div>

        <div class="card-panel">
          <div class="tabbar">
            <div class="tab active" data-t="meditation">🧘 冥想</div>
            <div class="tab" data-t="writing">✍️ 写作</div>
            <div class="tab" data-t="mood">💚 心情</div>
          </div>

          <div id="panel-meditation">
            <label for="med-text">这次的冥想感受</label>
            <textarea id="med-text" placeholder="例如：跟着引导放松了 10 分钟，心跳慢下来了…"></textarea>
            <button class="btn btn-primary" onclick="addRec('meditation')" style="min-height:44px;padding:9px 22px;font-size:0.88rem">保存冥想记录</button>
            <div id="list-meditation" style="margin-top:16px"></div>
          </div>

          <div id="panel-writing" class="hidden">
            <label for="write-text">这次的写作记录</label>
            <textarea id="write-text" placeholder="例如：写完了《旅鸽玛莎》的灵感小故事…"></textarea>
            <button class="btn btn-primary" onclick="addRec('writing')" style="min-height:44px;padding:9px 22px;font-size:0.88rem">保存写作记录</button>
            <div id="list-writing" style="margin-top:16px"></div>
          </div>

          <div id="panel-mood" class="hidden">
            <label>今天的心情</label>
            <div class="mood-pick" id="mood-picks">
              <span class="mood" data-m="😌">😌</span>
              <span class="mood" data-m="😊">😊</span>
              <span class="mood" data-m="🥹">🥹</span>
              <span class="mood" data-m="🥺">🥺</span>
              <span class="mood" data-m="😔">😔</span>
              <span class="mood" data-m="😰">😰</span>
              <span class="mood" data-m="😢">😢</span>
              <span class="mood" data-m="😤">😤</span>
              <span class="mood" data-m="🤩">🤩</span>
              <span class="mood" data-m="🤗">🤗</span>
              <span class="mood" data-m="😵‍💫">😵‍💫</span>
              <span class="mood" data-m="🥰">🥰</span>
            </div>
            <textarea id="mood-text" placeholder="想写几句就写几句（可选）" style="min-height:52px"></textarea>
            <button class="btn btn-primary" onclick="addRec('mood')" style="min-height:44px;padding:9px 22px;font-size:0.88rem">保存心情记录</button>

            <div class="mood-head">
              <span class="mood-count" id="mood-count"></span>
              <span class="mood-count">心情足迹 · 一格 = 一天</span>
            </div>
            <div class="mood-scroll">
              <div id="mood-grid"></div>
            </div>
          </div>
        </div>

    </div>

  <footer class="site-footer">
    <div class="footer-inner footer-wide">
      <p>© 2026 ve创作 · 一个面向茻人的故事采集与传播原型</p>
      <p class="footer-links">
        <a href="about.html">项目说明</a>
        <a href="about.html#principles">内容原则</a>

  <script src="js/nav.js"></script>
  <script src="js/record.js"></script>
  <script>
    var TOKEN = localStorage.getItem("ve_token");
    var USERNAME = localStorage.getItem("ve_user");
    var currentMood = "";

    function $(id){ return document.getElementById(id); }
    if (TOKEN) enter();

    $("btn-login").onclick = function(){ auth("/api/login"); };
    $("btn-register").onclick = function(){ auth("/api/register"); };
    function auth(url){
      var u = $("login-user").value.trim(), p = $("login-pass").value;
      fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({username:u, password:p})})
        .then(function(r){return r.json();}).then(function(res){
          if(!res.ok){ $("login-msg").textContent = res.error || "出错了"; return; }
          localStorage.setItem("ve_token", res.token);
          localStorage.setItem("ve_user", res.username);
          TOKEN = res.token; USERNAME = res.username;
          enter();
        });
    }
    function enter(){
      $("view-login").classList.add("hidden");
      $("view-profile").classList.remove("hidden");
      $("who").textContent = USERNAME;
      load();
    }
    function logout(){
      localStorage.removeItem("ve_token"); localStorage.removeItem("ve_user");
      location.reload();
    }
    $("btn-logout").onclick = logout;

    var qMood = "";
    document.querySelectorAll("#q-mood-picks .mood").forEach(function(m){
      m.onclick = function(){
        document.querySelectorAll("#q-mood-picks .mood").forEach(function(x){ x.classList.remove("sel"); });
        m.classList.add("sel"); qMood = m.getAttribute("data-m");
      };
    });
    $("btn-q-mood").onclick = function(){
      if(!qMood){ alert("先选一个心情"); return; }
      var note = $("q-mood-text").value.trim();
      veRecord.mood(qMood, note);
      $("q-mood-text").value = "";
      load();
    };

    document.querySelectorAll(".tab").forEach(function(tab){
      tab.onclick = function(){
        document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        ["meditation","writing","mood"].forEach(function(t){
          $("panel-"+t).classList.toggle("hidden", t !== tab.getAttribute("data-t"));
        });
      };
    });

    document.querySelectorAll("#mood-picks .mood").forEach(function(m){
      m.onclick = function(){
        document.querySelectorAll("#mood-picks .mood").forEach(function(x){ x.classList.remove("sel"); });
        m.classList.add("sel"); currentMood = m.getAttribute("data-m");
      };
    });

    function addRec(type){
      var text;
      if(type==="mood"){
        if(!currentMood){ alert("先选一个心情"); return; }
        text = currentMood + ( $("mood-text").value ? " " + $("mood-text").value.trim() : "");
      } else {
        text = (type==="meditation" ? $("med-text").value : $("write-text").value).trim();
        if(!text){ alert("写点什么再保存"); return; }
      }
      fetch("/api/records", {method:"POST", headers:{"Content-Type":"application/json","x-token":TOKEN},
        body: JSON.stringify({type:type, text:text})})
        .then(function(r){return r.json();}).then(function(res){
          if(!res.ok){ alert(res.error || "保存失败，请重新登录"); }
          load();
        });
    }

    function load(){
      fetch("/api/records", {headers:{"x-token":TOKEN}}).then(function(r){return r.json();}).then(function(res){
        if(!res.ok){ alert("登录已失效，请重新登录"); logout(); return; }
        ["meditation","writing","mood"].forEach(function(t){
          var list = res.records.filter(function(r){ return r.type===t; });
          render(t, list);
        });
      });
    }

    function render(type, arr){
      if(type==="mood"){ renderMoodGrid(arr); return; }
      var box = $("list-"+type);
      if(!arr.length){ box.innerHTML = '<p class="empty-note">还没有记录。</p>'; return; }
      box.innerHTML = arr.slice().reverse().map(function(r){
        return '<div class="rec"><span class="del" onclick="delRec(\''+r.id+'\')">删除</span>'+
          '<div>' + r.text.replace(/</g,"&lt;") + '</div>'+
          '<div class="date">' + (r.date||"") + '</div></div>';
      }).join("");
    }

    function moodEmoji(text){
      var moods=["😌","😊","🥹","🥺","😔","😰","😢","😤","🤩","🤗","😵‍💫","🥰"];
      for(var i=0;i<moods.length;i++){ if(String(text).indexOf(moods[i])===0) return moods[i]; }
      return "😌";
    }
    function monthAbbr(m){
      var a=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return a[m];
    }
    function renderMoodGrid(records){
      var grid = $("mood-grid");
      var today = new Date(); today.setHours(0,0,0,0);
      var moodMap = {};
      records.forEach(function(r){ moodMap[r.date] = r.text; });

      var start = new Date(today); start.setDate(start.getDate() - 51*7);
      start.setDate(start.getDate() - ((start.getDay()+6)%7));

      var weeks = [];
      var d = new Date(start);
      while(d <= today){ weeks.push(new Date(d)); d.setDate(d.getDate()+7); }

      var months = weeks.map(function(ws){
        for(var i=0;i<7;i++){
          var dd = new Date(ws); dd.setDate(ws.getDate()+i);
          if(dd.getDate()===1 && dd<=today) return monthAbbr(dd.getMonth());
        }
        return "";
      });

      var days = ["Mon","","Wed","","Fri","",""];
      var html = "<table class='mood-table'><tr><th></th>";
      weeks.forEach(function(ws,i){ html += "<th>"+months[i]+"</th>"; });
      html += "</tr>";
      for(var wd=0; wd<7; wd++){
        html += "<tr><td class='wd'>"+days[wd]+"</td>";
        weeks.forEach(function(ws){
          var dd = new Date(ws); dd.setDate(ws.getDate()+wd);
          if(dd > today){ html += "<td></td>"; return; }
          var key = dd.getFullYear()+"-"+("0"+(dd.getMonth()+1)).slice(-2)+"-"+("0"+dd.getDate()).slice(-2);
          var mood = moodMap[key];
          if(mood){
            html += "<td class='cell mood' title='"+key+" · "+String(mood).replace(/</g,'&lt;')+"'>"+moodEmoji(mood)+"</td>";
          } else {
            html += "<td class='cell' title='"+key+"'></td>";
          }
        });
        html += "</tr>";
      }
      html += "</table>";
      grid.innerHTML = html;
      $("mood-count").textContent = "已记录 " + records.length + " 天的心情";
    }

    function delRec(id){
      fetch("/api/records/"+id, {method:"DELETE", headers:{"x-token":TOKEN}})
        .then(function(r){return r.json();}).then(load);
    }
  </script>
</body>
